<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang bảo trì - Vietnamese ↔ Lao Translator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .maintenance-container {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .maintenance-icon {
            font-size: 80px;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .message {
            color: #666;
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .highlight {
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            margin: 30px auto 20px;
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .contact-info {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
            color: #999;
            font-size: 14px;
        }

        .refresh-btn {
            margin-top: 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .refresh-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .maintenance-container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 26px;
            }

            .message {
                font-size: 16px;
            }

            .maintenance-icon {
                font-size: 60px;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            }

            .maintenance-container {
                background: #23272b;
                color: #e0e0e0;
            }

            h1 {
                color: #e0e0e0;
            }

            .message {
                color: #b0b0b0;
            }

            .contact-info {
                border-top-color: #3a3a3a;
                color: #888;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">🚧</div>
        <h1>Website đang bảo trì</h1>
        
        <p class="message">
            Chúng tôi xin lỗi vì sự bất tiện này.
        </p>
        <p class="message">
            Hệ thống đang gặp một số sự cố và đội ngũ kỹ thuật đang khắc phục.
        </p>
        
        <div class="spinner"></div>
        
        <p class="message">
            <span class="highlight">Chúng tôi sẽ quay lại sớm nhất có thể.</span>
        </p>

        <button class="refresh-btn" onclick="location.reload()">
            🔄 Tải lại trang
        </button>

        <div class="contact-info">
            <p>Cảm ơn bạn đã kiên nhẫn chờ đợi 🙏</p>
            <p style="margin-top: 10px;">© <span id="year"></span> LVTranslator - All rights reserved</p>
        </div>
    </div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Auto refresh every 2 minutes
        setTimeout(() => {
            location.reload();
        }, 120000);
    </script>
</body>
</html>
